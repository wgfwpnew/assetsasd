<!-- History guard for H5 rewarded ads (2026-10-02) -->
<script>
(function () {
  // Google's H5 Ads SDK pushes #goog_fullscreen_ad via history.pushState when
  // a rewarded/interstitial ad starts, then calls history.back() when it ends.
  // Inside an iframe (or a fresh tab) there is no back-history entry, so
  // history.back() navigates the frame to about:blank — killing the game.
  // Fix: replaceState a sentinel on load so there is always a landing entry,
  // and re-push on popstate to stay resilient across multiple ad cycles.
  if (!history.state || !history.state._rbGuard) {
    history.replaceState({ _rbGuard: true }, '');
  }
  window.addEventListener('popstate', function () {
    if (!history.state || !history.state._rbGuard) {
      history.pushState({ _rbGuard: true }, '');
    }
  });
})();
